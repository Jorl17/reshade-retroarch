name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to publish a release for v* tags

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for git describe in the zip name

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: bash
        run: python -m pip install numpy pillow

      - name: Build
        shell: cmd
        run: build.bat

      - name: Grid detection tests
        shell: bash
        run: |
          python tests/make_synthetic.py --procedural out/synthetic
          out/build/detect_test.exe out/synthetic/manifest.txt
          out/build/detect_test.exe --rules

      - name: Test host draws identical frames (software Direct3D)
        shell: bash
        run: python tests/host_selftest.py --warp-only

      - name: File handling tests
        shell: bash
        run: out/build/files_test.exe

      # The add-on inside ReShade, on OpenGL with Mesa's software driver. Direct3D and Vulkan
      # are only tested locally: this machine has no GPU, ReShade does not run on Windows'
      # software Direct3D devices, and ReShade 6.8.0 crashes on Mesa's software Vulkan
      # driver (see README).
      - name: Cache end-to-end test dependencies
        uses: actions/cache@v4
        with:
          path: out/ci-deps
          key: ci-deps-${{ hashFiles('tests/ci_deps.py', 'tools/package.py') }}

      - name: Fetch end-to-end test dependencies
        shell: bash
        run: python tests/ci_deps.py out/ci-deps

      # librashader.dll needs D3DX9_43.dll from Microsoft's DirectX End-User Runtime (June
      # 2010), which this machine does not have. The installer is checked to be signed by
      # Microsoft (Microsoft publishes no checksum for it).
      - name: Install the DirectX End-User Runtime (June 2010)
        shell: pwsh
        run: |
          $exe = "out\ci-deps\downloads\directx_Jun2010_redist.exe"
          if (-not (Test-Path $exe)) {
            Invoke-WebRequest "https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe" -OutFile $exe
          }
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "unexpected signature on ${exe}: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          Start-Process $exe -ArgumentList "/Q", "/T:$PWD\out\dxredist" -Wait
          Start-Process "out\dxredist\DXSETUP.exe" -ArgumentList "/silent" -Wait
          if (-not (Test-Path "$env:windir\System32\D3DX9_43.dll")) { throw "D3DX9_43.dll was not installed" }

      # Windows' own OpenGL is version 1.1 without a GPU driver. Register Mesa's OpenGL
      # driver as the system's OpenGL driver, as mesa-dist-win's system-wide deployment tool
      # does (bin/systemwidedeploy.cmd, bin/modules/reggl.cmd). Only on this CI machine.
      - name: Use Mesa's software OpenGL
        shell: pwsh
        run: |
          $mesa = "out\ci-deps\mesa\x64"
          Copy-Item "$mesa\libgallium_wgl.dll" "$env:windir\System32\mesadrv.dll"
          if (Test-Path "$mesa\libglapi.dll") { Copy-Item "$mesa\libglapi.dll" "$env:windir\System32\" }
          $key = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DLL -Value "mesadrv.dll"
          Set-ItemProperty -Path $key -Name DriverVersion -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name Flags -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name Version -Value 2 -Type DWord

      - name: End-to-end test (OpenGL, software rendering)
        shell: bash
        run: |
          export GALLIUM_DRIVER=llvmpipe
          python tests/e2e.py --apis opengl --reshade out/ci-deps/ReShade64.dll \
            --librashader out/ci-deps/librashader.dll --shaders out/ci-deps/slang-shaders \
            --preset crt/zfast-crt.slangp --native out/synthetic/native.png

      - name: Package
        shell: bash
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: RetroArchShaders
          path: out/package/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/package/*.zip --generate-notes
