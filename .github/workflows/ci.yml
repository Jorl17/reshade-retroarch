name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to publish a release for v* tags

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for git describe in the zip name

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: bash
        run: python -m pip install numpy pillow

      - name: Build
        shell: cmd
        run: build.bat

      - name: Grid detection tests
        shell: bash
        run: |
          python tests/make_synthetic.py --procedural out/synthetic
          out/build/detect_test.exe out/synthetic/manifest.txt
          out/build/detect_test.exe --rules

      - name: Test host draws identical frames (software Direct3D)
        shell: bash
        run: python tests/host_selftest.py --warp-only

      - name: File handling tests
        shell: bash
        run: out/build/files_test.exe

      # The add-on inside ReShade, on Vulkan with Mesa's software Vulkan driver and the
      # Vulkan validation layer. Direct3D is only tested locally: ReShade does not run on
      # Windows' software Direct3D devices, and this machine has no GPU (see README).
      - name: Cache end-to-end test dependencies
        uses: actions/cache@v4
        with:
          path: out/ci-deps
          key: ci-deps-${{ hashFiles('tests/ci_deps.py', 'tools/package.py') }}

      - name: Fetch end-to-end test dependencies
        shell: bash
        run: python tests/ci_deps.py out/ci-deps

      - name: End-to-end test (Vulkan, software rendering)
        shell: bash
        run: |
          export PATH="$PWD/out/ci-deps/vulkan-runtime:$PATH"
          export VK_DRIVER_FILES="$(cygpath -w "$PWD/out/ci-deps/lavapipe/lvp_icd.x86_64.json")"
          python tests/e2e.py --apis vulkan --reshade out/ci-deps/ReShade64.dll \
            --librashader out/ci-deps/librashader.dll --shaders out/ci-deps/slang-shaders \
            --preset crt/zfast-crt.slangp --native out/synthetic/native.png \
            --vulkan-validation out/ci-deps/vulkan-sdk/Bin

      - name: Package
        shell: bash
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: RetroArchShaders
          path: out/package/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/package/*.zip --generate-notes
